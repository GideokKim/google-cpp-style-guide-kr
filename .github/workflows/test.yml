name: "Tests"

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          architecture: x64

      - name: "Run unit tests"
        run: >
          python3 -m unittest discover tests

      - name: "Check translation coverage"
        run: >
          python3 scripts/check_translation_coverage.py
